apply plugin: 'com.android.application'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

// ---- Build info: which branch/commit is running on the robot ----
// Baked into BuildConfig at build time and shown at INIT by BuildInfo.show(),
// so a deploy from the wrong branch is visible BEFORE anyone presses start.
// Falls back to "unknown" if git isn't available to the build.
def gitOut = { List<String> gitArgs ->
    try {
        return providers.exec {
            commandLine(['git'] + gitArgs)
            ignoreExitValue = true
        }.standardOutput.asText.get().trim()
    } catch (Exception ignored) {
        return ''
    }
}
def gitBranch = gitOut(['rev-parse', '--abbrev-ref', 'HEAD']) ?: 'unknown'
def gitCommit = gitOut(['rev-parse', '--short', 'HEAD']) ?: 'unknown'
// "Dirty" = uncommitted changes to robot code. Only code paths count, so the
// auto-regenerated VERSIONS.md doesn't flag every build.
def gitDirty = !gitOut(['status', '--porcelain', '--',
                        'TeamCode', 'FtcRobotController', 'build.common.gradle',
                        'build.dependencies.gradle', 'build.gradle']).isEmpty()
def buildTime = new Date().format('MM/dd HH:mm')

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        buildConfigField 'String', 'GIT_BRANCH', "\"${gitBranch}\""
        buildConfigField 'String', 'GIT_COMMIT', "\"${gitCommit}\""
        buildConfigField 'boolean', 'GIT_DIRTY', "${gitDirty}"
        buildConfigField 'String', 'BUILD_TIME', "\"${buildTime}\""
    }

    // Pedro Pathing / Panels dependencies pull in AndroidX libraries that require
    // compiling against a newer Android API than the stock FTC SDK's compileSdk 30.
    compileSdkVersion 34

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
}

dependencies {
    implementation project(':FtcRobotController')

    // Laptop-only unit tests in src/test/java -- no robot needed.
    // Run with: gradlew :TeamCode:testDebugUnitTest
    testImplementation 'junit:junit:4.13.2'
}
